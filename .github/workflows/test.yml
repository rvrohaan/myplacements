name: tests

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch makes the previous run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (sqlite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: pytest
        # The Postgres tier runs in its own job below.
        run: pytest -m "not postgres" --cov=app --cov-report=term-missing

  backend-postgres:
    name: backend (postgres)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: myplacements_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: pytest (contract tier)
        # Catches what SQLite cannot: native enum values, ilike semantics,
        # NULL ordering, and the Postgres-only migration statements.
        env:
          TEST_POSTGRES_URL: postgresql://postgres:password@localhost:5432/myplacements_test
        run: pytest -m postgres

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: typecheck (app)
        run: npm run typecheck
      - name: typecheck (tests)
        run: npm run typecheck:test
      - name: vitest
        run: npm test
      - name: build
        run: npx vite build

  e2e:
    name: end-to-end
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: myplacements_e2e
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: install
        run: |
          python -m venv backend/venv
          backend/venv/bin/python -m pip install -r backend/requirements.txt
          npm --prefix frontend ci
      - name: install the browser
        run: npx --prefix frontend playwright install --with-deps chromium
      - name: playwright
        working-directory: frontend
        env:
          E2E_DATABASE_URL: postgresql://postgres:password@127.0.0.1:5432/myplacements_e2e
          # The config resolves the interpreter per platform; Linux runners put
          # it in bin/ rather than Scripts/.
          E2E_PYTHON: ${{ github.workspace }}/backend/venv/bin/python
        run: npm run e2e
