[pytest]
testpaths = tests
# Import mode + rootdir so `from app...` resolves without installing the package.
pythonpath = .
addopts = -q --strict-markers
asyncio_mode = auto

markers =
    allow_network: permit real outbound sockets (default: blocked, see conftest)
    postgres: requires a real Postgres (the contract tier); deselect with -m "not postgres"

# Deprecations raised from our own code are failures, so they get fixed while
# the context is fresh. Later entries win over earlier ones.
filterwarnings =
    error::DeprecationWarning:app.*
    # Except this one. Storing naive UTC via utcnow() is a deliberate, codebase-
    # wide choice (see app/core/timeutil.py); moving off it is a schema decision,
    # not something a test run should force.
    ignore:datetime.datetime.utcnow.*:DeprecationWarning
    # And this one. 20 response schemas still declare a class-based Config;
    # migrating them to ConfigDict is its own change, not something to do from
    # inside a test run. Scoped to that message so other Pydantic deprecations
    # still surface.
    ignore:Support for class-based `config` is deprecated.*
